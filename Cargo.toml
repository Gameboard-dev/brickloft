[workspace]
resolver = "2"
# Every member listed here must exist: cargo (and so rust-analyzer) fails to
# load the whole workspace if one is missing.
members = ["core", "editor"]
# The editor is a default member so that `cargo test` covers its logic too.
# Its renderer is compiled once (about 50 s) and cached after that.
default-members = ["core", "editor"]
# The generator (docs/generate.md) is a workspace of its own with its own
# lock file, and is named here only so that cargo does not take it for a
# member that was forgotten. Nothing built or tested from this folder reads
# it: its four hundred dependencies, two of them git repositories, are
# resolved and compiled only by `cargo build` run inside generate/.
exclude = ["generate"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

# Compile-time settings. The editor builds unoptimised with thin debug info
# for fast rebuilds; dependencies are optimised once and then cached, which
# also keeps the editor usable in a dev build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# the fitters are hot loops; keep them quick in dev builds and tests too
[profile.dev.package.brickloft-core]
opt-level = 2

[profile.release]
opt-level = 3
strip = true
