[package]
name = "omegga-arcs"
description = "Omegga plugin: places forms from the arcs editor into the world"
version.workspace = true
edition.workspace = true
license.workspace = true

# Three dependencies, chosen against writing the same thing by hand:
# - serde_json: the JSON-RPC protocol omegga speaks and the editor's requests
# - tiny_http: the editor's page and its one POST. Parsing HTTP by hand is where
#   request-smuggling and overflow bugs come from; this is small and has no TLS
#   or async runtime with its default features off.
# - getrandom: link tokens must be unguessable, and std has no secure RNG
# The usual `omegga` crate is not used: it pulls in tokio for what is, here,
# two blocking threads.
[dependencies]
arcs-core = { path = "../core" }
serde_json = "1"
tiny_http = { version = "0.12", default-features = false }
getrandom = "0.4"
